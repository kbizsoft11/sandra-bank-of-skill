<div class="app-shell">
  <div class="sidebar-backdrop" [class.show]="sidebarOpen" (click)="closeSidebar()"></div>

  <app-dashboard-sidebar [sidebarOpen]="sidebarOpen" (sidebarItemClicked)="closeSidebar()"></app-dashboard-sidebar>

  <div class="main-content">
    <app-dashboard-header (toggleSidebar)="toggleSidebar()" />

    <main class="dashboard-main">
      <router-outlet />
    </main>
  </div>
</div>
