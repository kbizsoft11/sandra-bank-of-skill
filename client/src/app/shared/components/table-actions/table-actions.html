<div class="d-flex align-items-center gap-2">

    @if(actions().includes('view')){
    <!-- View -->
    <button (click)="view.emit()" class="btn btn-sm p-2 text-primary bg-primary-subtle rounded-3" title="View">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
    </button>
    }

    @if(actions().includes('edit')){
    <!-- Edit -->
    <button (click)="edit.emit()" class="btn btn-sm p-2 text-warning bg-warning-subtle rounded-3" title="Edit">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5" />
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
    </button>
    }

    @if(actions().includes('delete')){
    <!-- Delete -->
    <button (click)="delete.emit()" class="btn btn-sm p-2 text-danger bg-danger-subtle rounded-3" title="Delete">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7" />
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M10 11v6M14 11v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16" />
        </svg>
    </button>
    }
</div>
