<div class="prism-frame-backdrop" role="presentation" (click)="close()">
  <section class="prism-frame-dialog" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
    <header class="prism-frame-header">
      <h2>{{ title }}</h2>
      <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
    </header>

    @if (safeUrl) {
      <iframe class="prism-frame-iframe" src="safeUrl" [title]="title" loading="eager" allow="fullscreen; payment" ></iframe>
    } @else {
      <div class="prism-frame-error">
        <i class="bi bi-exclamation-circle"></i>
        <p>The assessment link is unavailable or invalid.</p>
        <button type="button" class="btn btn-primary" (click)="close()">Close</button>
      </div>
    }
  </section>
</div>
