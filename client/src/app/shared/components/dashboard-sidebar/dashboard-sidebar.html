<aside class="sidebar" id="sidebar" [class.show]="sidebarOpen">
  <div class="sidebar-brand">
    <img src="/assets/images/logo- 1.png" alt="Bank of Skill" />
  </div>

  <nav class="sidebar-nav">
    @for (item of menuItems(); track item.label) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item-link"
        (click)="closeSidebar()"
      >
        <span class="nav-icon-circle">
          <i [class]="item.icon"></i>
        </span>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="org-card">
      <div class="icon-box">
        <i class="bi bi-building"></i>
      </div>
      <div>
        <div style="font-weight: 600; font-size: 13.5px;">Abc Corporation</div>
        <small class="org-plan">Enterprise Plan</small>
      </div>
    </div>

    <div class="user-card" (click)="toggleUserMenu($event)">
      @if (profileImage()) {
        <img [src]="profileImage()" [alt]="auth.user()?.fullName" />
      } @else {
        <div class="user-avatar" [style.background]="getRandomColor()">
          {{ getInitials() }}
        </div>
      }
      <div class="flex-grow-1">
        <div style="font-weight: 600; font-size: 13.5px;">{{ auth.user()?.fullName || 'User' }}</div>
        <small>{{ auth.user()?.role || 'Admin' }}</small>
      </div>
      <i class="bi bi-chevron-down" style="color: #9aa3af;"></i>

      <div class="sidebar-user-menu" *ngIf="showUserMenu" (click)="$event.stopPropagation()">
        <a class="sidebar-user-item" [routerLink]="getProfileRoute()">View Profile</a>
        <button class="sidebar-user-item btn-logout" type="button" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</aside>
