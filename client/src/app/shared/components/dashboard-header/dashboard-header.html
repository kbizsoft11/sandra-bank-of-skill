<header
  class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-6 dark:border-slate-800 dark:bg-slate-900"
>
  <div>
    <h1 class="text-lg font-semibold text-slate-900 dark:text-white">
      Dashboard
    </h1>

    <p class="text-xs text-slate-500 dark:text-slate-400">
      Welcome back
    </p>
  </div>

  <div class="flex items-center gap-4">

    <!-- Theme Toggle -->
    <button
      (click)="toggleTheme()"
      class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
    >
      {{ isDark ? '☀️' : '🌙' }}
    </button>

    <!-- User Info -->
    <div class="flex items-center gap-3">

      <div
        class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 font-medium text-white"
      >
        A
      </div>

      <div>
        <p class="text-sm font-medium text-slate-900 dark:text-white">
          Admin
        </p>

        <button (click)="logout()" class="text-xs cursor-pointer text-red-500 dark:text-red-400">
          logout
        </button>
      </div>

    </div>

  </div>
</header>
