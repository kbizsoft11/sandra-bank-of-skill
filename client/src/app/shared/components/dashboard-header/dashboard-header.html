<header class="dashboard-header">
  <div class="topbar">
    <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Toggle navigation" (click)="onToggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <div class="search-input-wrap">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search by skills, roles, or keywords..." />
    </div>

    <button class="icon-btn" type="button" aria-label="Notifications">
      <i class="bi bi-bell"></i>
      <span class="badge-dot">4</span>
    </button>

    <button class="icon-btn" type="button" aria-label="Help">
      <i class="bi bi-question-circle"></i>
    </button>

    <div class="profile-chip dropdown" (click)="toggleProfileMenu($event)">
      @if (profileImage()) {
        <img [src]="profileImage()" [alt]="auth.user()?.fullName" />
      } @else {
        <div class="profile-avatar" [style.background]="getRandomColor()">
          {{ getInitials() }}
        </div>
      }
      <div>
        <div class="name">{{ auth.user()?.fullName || 'User' }}</div>
        <div class="role">{{ auth.user()?.role || 'Admin' }}</div>
      </div>
      <i class="bi bi-chevron-down" style="color: #9aa3af; font-size: 13px"></i>

      <div class="profile-menu" *ngIf="showProfileMenu" (click)="$event.stopPropagation()">
        <a class="profile-menu-item" [routerLink]="profileLink">Profile</a>
        <button class="profile-menu-item btn-logout" type="button" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</header>
