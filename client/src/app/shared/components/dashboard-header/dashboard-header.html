<header class="dashboard-header">
  <div class="topbar">
    <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Toggle navigation" (click)="onToggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <div class="search-input-wrap">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search by skills, roles, or keywords..." />
    </div>

    <button class="icon-btn" type="button" aria-label="Notifications">
      <i class="bi bi-bell"></i>
      <span class="badge-dot">4</span>
    </button>

    <button class="icon-btn" type="button" aria-label="Help">
      <i class="bi bi-question-circle"></i>
    </button>

    <div class="profile-chip dropdown">
      <img src="https://i.pravatar.cc/80?u={{ auth.user()?._id }}" alt="" />
      <div>
        <div class="name">{{ auth.user()?.fullName || 'Alex' }}</div>
        <div class="role">{{ auth.user()?.role || 'Admin' }}</div>
      </div>
      <i class="bi bi-chevron-down" style="color: #9aa3af; font-size: 13px"></i>
    </div>
  </div>
</header>
