<div class="row justify-content-center">

    <div class="col-xl-7 col-lg-6 col-md-8">

        <div class="create-account-card">

            <!-- Heading -->

            <div class="text-center">

                <span class="create-account-step">
                    Step 1 Of 4
                </span>

                <h2 class="create-account-title">
                    Create Your Account
                </h2>

                <p class="create-account-subtitle">
                    Start Your Journey With Bank Of Skill And Unlock The Power Of Skills Intelligence
                </p>

            </div>

            <!-- Progress -->

            <div class="create-account-progress">

                <div class="create-progress-step active">
                    <span>1</span>
                </div>

                <div class="create-progress-arrow">
                    <span class="create-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>
                </div>

                <div class="create-progress-step">
                    <span>2</span>
                </div>

                <div class="create-progress-arrow">
                    <span class="create-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>
                </div>

                <div class="create-progress-step">
                    <span>3</span>
                </div>

                <div class="create-progress-arrow">
                    <span class="create-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>
                </div>

                <div class="create-progress-step">
                    <span>4</span>
                </div>



            </div>
            <!-- Form -->

            <form>

                <!-- Full Name -->

                <div class="mb-3">

                    <label class="form-label create-account-label">
                        Full Name
                    </label>

                    <div class="create-input-group">

                        <span>
                            <i class="bi bi-person"></i>
                        </span>

                        <input type="text" class="form-control create-account-input" placeholder="Enter your full name">

                    </div>

                </div>

                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label create-account-label">
                        Email Address
                    </label>

                    <div class="create-input-group">

                        <span>
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input type="email" class="form-control create-account-input"
                            placeholder="Enter your email address">

                    </div>

                </div>

                <!-- Phone -->

                <div class="mb-3">

                    <label class="form-label create-account-label">
                        Phone Number
                    </label>

                    <div class="create-input-group">

                        <span>
                            <i class="bi bi-telephone"></i>
                        </span>

                        <input type="tel" class="form-control create-account-input"
                            placeholder="Enter your phone number">

                    </div>

                </div>

                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label create-account-label">
                        Password
                    </label>

                    <div class="create-input-group">

                        <span>
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password" class="form-control create-account-input"
                            placeholder="Create your password">

                        <button type="button" class="create-eye-btn">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <!-- Confirm Password -->

                <div class="mb-3">

                    <label class="form-label create-account-label">
                        Confirm Password
                    </label>

                    <div class="create-input-group">

                        <span>
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password" class="form-control create-account-input"
                            placeholder="Confirm your password">

                        <button type="button" class="create-eye-btn">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <!-- Terms -->

                <div class="form-check create-account-check mb-4">

                    <input class="form-check-input" type="checkbox" id="terms">

                    <label class="form-check-label" for="terms">

                        I agree to the
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>.

                    </label>

                </div>

                <!-- Continue -->

                <a routerLink="/auth/verify-email" class="btn create-account-btn w-100">
                    Continue
                </a>

                <!-- Divider -->

                <div class="create-account-divider">

                    <span>
                        or sign up with
                    </span>

                </div>

                <!-- Social -->

                <div class="row g-3">

                    <div class="col-6">

                        <button type="button" class="btn create-social-btn w-100">

                            <img src="/assets/icons/google-icon.svg" alt="">

                            Continue with Google

                        </button>

                    </div>

                    <div class="col-6">

                        <button type="button" class="btn create-social-btn w-100">

                            <i class="bi bi-apple"></i>

                            Continue with Apple

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>
