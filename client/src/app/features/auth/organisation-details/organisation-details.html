<div class="row justify-content-center">

    <div class="col-xl-7 col-lg-7 col-md-9">

        <div class="org-details-card">

            <!-- Heading -->

            <div class="text-center">

                <span class="org-details-step">
                    Step 3 Of 4
                </span>

                <h2 class="org-details-title">
                    Organisation Details
                </h2>

                <p class="org-details-subtitle">
                    Help Us Understand Your Organisation Better
                </p>

            </div>

            <!-- Progress -->

            <div class="verify-email-progress">

                <div class="verify-step completed">
                    <span>1</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line completed"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step completed">
                    <span>2</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line completed"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step active">
                    <span>3</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step">
                    <span>4</span>
                </div>



            </div>

            <!-- Form -->

            <form [formGroup]="organisationForm" (ngSubmit)="onSubmit()">

                <!-- Organisation -->

                <div class="mb-3">

                    <label class="form-label org-details-label">
                        Organisation Name
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-buildings"></i>
                        </span>

                        <input type="text" class="form-control org-details-input"
                            placeholder="Enter your organisation name" formControlName="organisationName">

                    </div>

                </div>

                <!-- Industry -->

                <div class="mb-3">

                    <label class="form-label org-details-label">
                        Industry
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-briefcase"></i>
                        </span>

                        <select class="form-select org-details-select" formControlName="industry">

                            <option selected disabled>Select your industry</option>

                            <option>Information Technology</option>
                            <option>Healthcare & Medical</option>
                            <option>Banking & Finance</option>
                            <option>Education</option>
                            <option>Retail & E-Commerce</option>
                            <option>Manufacturing</option>
                            <option>Construction</option>
                            <option>Hospitality</option>
                            <option>Real Estate</option>
                            <option>Marketing & Advertising</option>
                            <option>Government</option>

                        </select>

                    </div>

                </div>

                <!-- Team Size -->

                <div class="mb-3">

                    <label class="form-label org-details-label">
                        Team Size
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-people"></i>
                        </span>

                        <select class="form-select org-details-select" formControlName="teamSize">

                            <option selected disabled value="">Select team size</option>

                            <option value="1-10">1 - 10 Employees</option>
                            <option value="11-25">11 - 25 Employees</option>
                            <option value="26-50">26 - 50 Employees</option>
                            <option value="51-100">51 - 100 Employees</option>
                            <option value="101-250">101 - 250 Employees</option>
                            <option value="251-500">251 - 500 Employees</option>
                            <option value="500-1000">500 - 1000 Employees</option>
                            <option value="1000+">1000+ Employees</option>

                        </select>

                    </div>

                </div>

                <!-- Country -->

                <div class="mb-4">

                    <label class="form-label org-details-label">
                        Country
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-globe"></i>
                        </span>

                        <select class="form-select org-details-select" formControlName="country">

                            <option selected disabled>Select your country</option>

                            <option>India 🇮🇳</option>
                            <option>United States 🇺🇸</option>
                            <option>United Kingdom 🇬🇧</option>
                            <option>Canada 🇨🇦</option>
                            <option>Australia 🇦🇺</option>
                            <option>Germany 🇩🇪</option>
                            <option>Singapore 🇸🇬</option>
                            <option>United Arab Emirates 🇦🇪</option>
                            <option>Japan 🇯🇵</option>
                            <option>France 🇫🇷</option>

                        </select>

                    </div>

                </div>

                <!-- Error Message -->
                @if (errorMessage) {
                    <div class="alert alert-danger" role="alert">
                        {{ errorMessage }}
                    </div>
                }

                <!-- Continue Button -->

                <button 
                    type="submit" 
                    class="btn org-details-continue-btn w-100"
                    [disabled]="isLoading || organisationForm.invalid">
                    @if (isLoading) {
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        Saving...
                    } @else {
                        Continue
                    }
                </button>

                <!-- Bottom -->

                <p class="org-details-bottom">

                    You can change these details later from
                    <strong>Settings</strong>

                </p>

            </form>

        </div>

    </div>

</div>
