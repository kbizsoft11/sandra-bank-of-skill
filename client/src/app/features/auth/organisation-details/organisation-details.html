<div class="row justify-content-center">

    <div class="col-xl-7 col-lg-7 col-md-9">

        <div class="org-details-card">

            <!-- Heading -->

            <div class="text-center">

                <span class="org-details-step">
                    Step 3 Of 4
                </span>

                <h2 class="org-details-title">
                    Organisation Details
                </h2>

                <p class="org-details-subtitle">
                    Help Us Understand Your Organisation Better
                </p>

            </div>

            <!-- Progress -->

            <div class="verify-email-progress">

                <div class="verify-step completed">
                    <span>1</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line completed"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step completed">
                    <span>2</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line completed"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step active">
                    <span>3</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step">
                    <span>4</span>
                </div>



            </div>

            <!-- Form -->

            <form>

                <!-- Organisation -->

                <div class="mb-3">

                    <label class="form-label org-details-label">
                        Organisation Name
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-buildings"></i>
                        </span>

                        <input type="text" class="form-control org-details-input"
                            placeholder="Enter your organisation name">

                    </div>

                </div>

                <!-- Industry -->

                <div class="mb-3">

                    <label class="form-label org-details-label">
                        Industry
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-briefcase"></i>
                        </span>

                        <select class="form-select org-details-select">

                            <option selected disabled>Select your industry</option>

                            <option>Information Technology</option>
                            <option>Healthcare & Medical</option>
                            <option>Banking & Finance</option>
                            <option>Education</option>
                            <option>Retail & E-Commerce</option>
                            <option>Manufacturing</option>
                            <option>Construction</option>
                            <option>Hospitality</option>
                            <option>Real Estate</option>
                            <option>Marketing & Advertising</option>
                            <option>Government</option>

                        </select>

                    </div>

                </div>

                <!-- Team Size -->

                <div class="mb-3">

                    <label class="form-label org-details-label">
                        Team Size
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-people"></i>
                        </span>

                        <select class="form-select org-details-select">

                            <option selected disabled>Select team size</option>

                            <option>1 - 10 Employees</option>
                            <option>11 - 25 Employees</option>
                            <option>26 - 50 Employees</option>
                            <option>51 - 100 Employees</option>
                            <option>101 - 250 Employees</option>
                            <option>251 - 500 Employees</option>
                            <option>500 - 1000 Employees</option>
                            <option>1000+ Employees</option>

                        </select>

                    </div>

                </div>

                <!-- Country -->

                <div class="mb-4">

                    <label class="form-label org-details-label">
                        Country
                    </label>

                    <div class="org-details-input-group">

                        <span>
                            <i class="bi bi-globe"></i>
                        </span>

                        <select class="form-select org-details-select">

                            <option selected disabled>Select your country</option>

                            <option>India 🇮🇳</option>
                            <option>United States 🇺🇸</option>
                            <option>United Kingdom 🇬🇧</option>
                            <option>Canada 🇨🇦</option>
                            <option>Australia 🇦🇺</option>
                            <option>Germany 🇩🇪</option>
                            <option>Singapore 🇸🇬</option>
                            <option>United Arab Emirates 🇦🇪</option>
                            <option>Japan 🇯🇵</option>
                            <option>France 🇫🇷</option>

                        </select>

                    </div>

                </div>

                <!-- Buttons -->

                <div class="row g-3">

                    <div class="col-6">
                        <a href="e-mail-verify.html" class="btn org-details-back-btn w-100">
                            Back
                        </a>
                    </div>

                    <div class="col-6">
                        <a routerLink="/auth/setup-complete" class="btn org-details-continue-btn w-100">
                            Continue
                        </a>
                    </div>

                </div>

                <!-- Bottom -->

                <p class="org-details-bottom">

                    You can change these details later from
                    <strong>Settings</strong>

                </p>

            </form>

        </div>

    </div>

</div>
