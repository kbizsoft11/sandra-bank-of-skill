<div class="row justify-content-center">

    <div class="col-xl-6 col-lg-7 col-md-9">

        <div class="verify-email-card">

            <!-- Heading -->

            <div class="text-center">

                <span class="verify-email-step">
                    Step 2 Of 4
                </span>

                <h2 class="verify-email-title">
                    Verify Your Email
                </h2>

                <p class="verify-email-subtitle">
                    We've Sent A 6-Digit Verification Code To
                </p>

            </div>

            <!-- Progress -->

            <div class="verify-email-progress">

                <div class="verify-step completed">
                    <span>1</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line completed"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step active">
                    <span>2</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step">
                    <span>3</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step">
                    <span>4</span>
                </div>



            </div>

            <!-- OTP -->

            <div class="verify-otp-section">

                <label class="verify-label">
                    Verification Code
                </label>

                <div class="verify-otp-inputs">

                    <input type="text" maxlength="1" class="form-control verify-otp-input">
                    <input type="text" maxlength="1" class="form-control verify-otp-input">
                    <input type="text" maxlength="1" class="form-control verify-otp-input">
                    <input type="text" maxlength="1" class="form-control verify-otp-input">
                    <input type="text" maxlength="1" class="form-control verify-otp-input">
                    <input type="text" maxlength="1" class="form-control verify-otp-input">

                </div>

            </div>

            <!-- Resend -->

            <p class="verify-resend">

                Didn't receive the code?

                <a href="#">Resend Code</a>

                <span>in 00:30</span>

            </p>

            <!-- Buttons -->

            <div class="row g-3">

                <div class="col-6">
                    <a href="sign-up.html" class="btn verify-back-btn w-100">
                        Back
                    </a>
                </div>

                <div class="col-6">
                    <a routerLink="/auth/organisation-details" class="btn verify-continue-btn w-100">
                        Continue
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>
