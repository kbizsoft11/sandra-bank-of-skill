<div class="row justify-content-center">

    <div class="col-xl-6 col-lg-7 col-md-9">

        <div class="verify-email-card">

            <!-- Heading -->

            <div class="text-center">

                <span class="verify-email-step">
                    Step 2 Of 4
                </span>

                <h2 class="verify-email-title">
                    Verify Your Email
                </h2>

                <p class="verify-email-subtitle">
                    We've Sent A 6-Digit Verification Code To <strong>{{ maskedEmail }}</strong>
                </p>

            </div>

            <!-- Error Message -->
            @if (errorMessage) {
                <div class="alert alert-danger" role="alert">
                    {{ errorMessage }}
                </div>
            }

            <!-- Progress -->

            <div class="verify-email-progress">

                <div class="verify-step completed">
                    <span>1</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line completed"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step active">
                    <span>2</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step">
                    <span>3</span>
                </div>

                <div class="verify-progress-arrow">
                    <span class="verify-progress-line"></span>
                    <i class="bi bi-chevron-right"></i>

                </div>

                <div class="verify-step">
                    <span>4</span>
                </div>



            </div>

            <!-- OTP -->

            <form [formGroup]="otpForm" (ngSubmit)="onSubmit()">

                <div class="verify-otp-section">

                    <label class="verify-label">
                        Verification Code
                    </label>

                    <div class="verify-otp-inputs">

                        <input 
                            type="text" 
                            maxlength="1" 
                            class="form-control verify-otp-input"
                            formControlName="digit1"
                            (input)="onOtpInput($event, 0)"
                            (keydown)="onOtpKeyDown($event, 0)"
                            (paste)="onOtpPaste($event)"
                            #otpInput>
                        <input 
                            type="text" 
                            maxlength="1" 
                            class="form-control verify-otp-input"
                            formControlName="digit2"
                            (input)="onOtpInput($event, 1)"
                            (keydown)="onOtpKeyDown($event, 1)"
                            #otpInput>
                        <input 
                            type="text" 
                            maxlength="1" 
                            class="form-control verify-otp-input"
                            formControlName="digit3"
                            (input)="onOtpInput($event, 2)"
                            (keydown)="onOtpKeyDown($event, 2)"
                            #otpInput>
                        <input 
                            type="text" 
                            maxlength="1" 
                            class="form-control verify-otp-input"
                            formControlName="digit4"
                            (input)="onOtpInput($event, 3)"
                            (keydown)="onOtpKeyDown($event, 3)"
                            #otpInput>
                        <input 
                            type="text" 
                            maxlength="1" 
                            class="form-control verify-otp-input"
                            formControlName="digit5"
                            (input)="onOtpInput($event, 4)"
                            (keydown)="onOtpKeyDown($event, 4)"
                            #otpInput>
                        <input 
                            type="text" 
                            maxlength="1" 
                            class="form-control verify-otp-input"
                            formControlName="digit6"
                            (input)="onOtpInput($event, 5)"
                            (keydown)="onOtpKeyDown($event, 5)"
                            #otpInput>

                    </div>

                </div>

                <!-- Resend -->

                <p class="verify-resend">

                    Didn't receive the code?

                    @if (canResend) {
                        <a href="javascript:void(0)" (click)="onResendOtp()">Resend Code</a>
                    } @else {
                        <span class="text-muted">Resend Code</span>
                        <span>in {{ formattedCountdown }}</span>
                    }

                </p>

                <!-- Continue Button -->

                <button 
                    type="submit" 
                    class="btn verify-continue-btn w-100"
                    [disabled]="isLoading || otpForm.invalid">
                    @if (isLoading) {
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        Verifying...
                    } @else {
                        Continue
                    }
                </button>

            </form>

        </div>

    </div>

</div>
