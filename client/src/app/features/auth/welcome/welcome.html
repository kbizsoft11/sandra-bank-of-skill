<!-- Heading -->
<div class="row justify-content-center">

    <div class="col-lg-8 col-md-10 text-center">

        <h1 class="login-title">
            Welcome to Bank of Skill
        </h1>

        <p class="login-subtitle">
            Discover, showcase, and grow your skills.
            Select an option below to continue your journey.
        </p>

    </div>

</div>

<!-- Cards -->
<div class="row justify-content-center g-4 g-lg-5 pt-4 pb-3">

    <!-- Login Card -->
    <div class="col-lg-5 col-md-6">

        <div class="login-card text-center">

            <div class="login-icon">
                <i class="bi bi-box-arrow-in-right"></i>
            </div>

            <h3>
                I already have a Bank of Skill account
            </h3>

            <span class="login-line"></span>

            <a routerLink="/auth/login" class="btn login-btn w-100">
                Log In
            </a>

        </div>

    </div>

    <!-- Signup Card -->
    <div class="col-lg-5 col-md-6">

        <div class="login-card text-center">

            <div class="login-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>

            <h3>
                Create Your Bank of Skill Account
            </h3>

            <span class="login-line"></span>

            <a routerLink="/auth/get-started" class="btn login-btn w-100">
                Get Started
            </a>

        </div>

    </div>

</div>
