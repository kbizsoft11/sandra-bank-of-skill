<div class="rounded-4 border bg-white shadow-sm overflow-hidden">

  <div class="d-flex align-items-center justify-content-between border-bottom px-4 py-3">

    <div>
      <h2 class="h5 fw-semibold mb-0 text-dark">
        Skills
      </h2>

      <p class="mt-1 mb-0 small text-secondary">
        Manage all skills
      </p>

    </div>

    <a routerLink="/admin/skills/create" class="btn btn-primary btn-sm px-3">

      Add Skill

    </a>

  </div>

  <div class="table-responsive">

    <table class="table align-middle mb-0">

      <thead>

        <tr class="table-light">

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Skill
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Category
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Employee
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Level
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Score
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Actions
          </th>

        </tr>

      </thead>

      <tbody>

        @for(skill of skills(); track skill._id){

        <tr>

          <td class="px-4 py-3">
            {{ skill.skill_name }}
          </td>

          <td class="px-4 py-3">
            {{ skill.cat_id.cat_name }}
          </td>

          <td class="px-4 py-3 text-secondary">
            {{ skill?.user_id?.fullName }}
          </td>

          <td class="px-4 py-3">
            {{ skill.skill_level }}
          </td>

          <td class="px-4 py-3">
            {{ skill.skill_score }}
          </td>

          <td class="px-4 py-3">

            <app-table-actions
              [actions]="['edit','delete']"
              (edit)="editSkill(skill)"
              (delete)="deleteSkill(skill)">
            </app-table-actions>

          </td>

        </tr>

        }

      </tbody>

    </table>

  </div>

</div>
