<div class="rounded-4 border p-4 shadow-sm bg-white">

  <div class="mb-4">

    <h2 class="h4 fw-semibold">
      Edit Skill
    </h2>

  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- Category -->

    <div class="mb-3">

      <label class="form-label">
        Category
      </label>

      <select formControlName="cat_id" class="form-select">

        <option value="">
          Select Category
        </option>

        @for(category of categories; track category._id){

        <option [value]="category._id">

          {{category.cat_name}}

        </option>

        }

      </select>

    </div>

    <!-- User -->

    <div class="mb-3">

      <label class="form-label">
        User
      </label>

      <select formControlName="user_id" class="form-select">

        <option value="">
          Select User
        </option>

        @for(user of users; track user._id){

        <option [value]="user._id">

          {{user.fullName}}

        </option>

        }

      </select>

    </div>

    <!-- Skill Name -->

    <div class="mb-3">

      <label class="form-label">
        Skill Name
      </label>

      <input type="text" formControlName="skill_name" class="form-control">

    </div>

    <!-- Description -->

    <div class="mb-3">

      <label class="form-label">
        Description
      </label>

      <textarea rows="4" formControlName="skill_desc" class="form-control">
      </textarea>

    </div>

    <!-- Level -->

    <div class="mb-3">

      <label class="form-label">
        Skill Level
      </label>

      <select formControlName="skill_level" class="form-select">

        <option [value]="1">
          Beginner
        </option>

        <option [value]="2">
          Intermediate
        </option>

        <option [value]="3">
          Advanced
        </option>

        <option [value]="4">
          Expert
        </option>

      </select>

    </div>

    <!-- Score -->

    <div class="mb-3">

      <label class="form-label">
        Skill Score
      </label>

      <input type="number" formControlName="skill_score" class="form-control">

    </div>

    <div class="d-flex justify-content-end gap-3 mt-4">

      <a routerLink="/admin/skills" class="btn btn-outline-secondary px-4">

        Cancel

      </a>

      <button type="submit" class="btn btn-primary px-4">

        Update

      </button>

    </div>

  </form>

</div>
