<div
  class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">

  <div class="mb-8">

    <h2 class="text-2xl font-semibold">
      Create Skill
    </h2>

    <p class="text-sm text-slate-500">
      Add a new skill.
    </p>

  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="space-y-6">

    <!-- Category -->

    <div>

      <label class="mb-2 block">
        Category
      </label>

      <select
        formControlName="cat_id"
        class="w-full rounded-lg border p-3">

        <option value="">
          Select Category
        </option>

        @for(category of categories(); track category._id){

        <option
          [value]="category._id">

          {{category.cat_name}}

        </option>

        }

      </select>

    </div>

    <!-- User -->

    <div>

      <label class="mb-2 block">
        User
      </label>

      <select
        formControlName="user_id"
        class="w-full rounded-lg border p-3">

        <option value="">
          Select User
        </option>

        @for(user of users(); track user._id){

        <option
          [value]="user._id">

          {{user.fullName}}

        </option>

        }

      </select>

    </div>

    <!-- Skill Name -->

    <div>

      <label class="mb-2 block">
        Skill Name
      </label>

      <input
        type="text"
        formControlName="skill_name"
        class="w-full rounded-lg border p-3">

    </div>

    <!-- Description -->

    <div>

      <label class="mb-2 block">
        Description
      </label>

      <textarea
        rows="4"
        formControlName="skill_desc"
        class="w-full rounded-lg border p-3">
      </textarea>

    </div>

    <!-- Level -->

    <div>

      <label class="mb-2 block">
        Skill Level
      </label>

      <select
        formControlName="skill_level"
        class="w-full rounded-lg border p-3">

        <option [value]="1">
          Beginner
        </option>

        <option [value]="2">
          Intermediate
        </option>

        <option [value]="3">
          Advanced
        </option>

        <option [value]="4">
          Expert
        </option>

      </select>

    </div>

    <!-- Score -->

    <div>

      <label class="mb-2 block">
        Skill Score
      </label>

      <input
        type="number"
        formControlName="skill_score"
        class="w-full rounded-lg border p-3">

    </div>

    <div
      class="flex justify-end gap-3">

      <a
        routerLink="/admin/skills"
        class="rounded-lg border px-5 py-2">

        Cancel

      </a>

      <button
        type="submit"
        class="rounded-lg bg-blue-600 px-5 py-2 text-white">

        Save

      </button>

    </div>

  </form>

</div>
