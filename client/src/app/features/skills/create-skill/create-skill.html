<div class="rounded-4 border p-4 shadow-sm bg-white">

  <div class="mb-4">

    <h2 class="h4 fw-semibold">
      Create Skill
    </h2>

    <p class="small text-secondary">
      Add a new skill.
    </p>

  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- Category -->

    <div class="mb-3">

      <label class="form-label">
        Category <span class="text-danger">*</span>
      </label>

      <select formControlName="categoryId" class="form-select">

        <option value="">
          Select Category
        </option>

        @for(category of categories(); track category._id){

        <option [value]="category._id">

          {{category.name}}

        </option>

        }

      </select>

      @if (form.get('categoryId')?.invalid && form.get('categoryId')?.touched) {
        <p class="mt-2 small text-danger">Category is required</p>
      }

    </div>

    <!-- Skill Name -->

    <div class="mb-3">

      <label class="form-label">
        Skill Name <span class="text-danger">*</span>
      </label>

      <input type="text" formControlName="name" class="form-control" placeholder="e.g., JavaScript, Project Management">

      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <p class="mt-2 small text-danger">Skill name is required</p>
      }

    </div>

    <!-- Description -->

    <div class="mb-3">

      <label class="form-label">
        Description
      </label>

      <textarea rows="4" formControlName="description" class="form-control" placeholder="Provide a brief description of this skill..."></textarea>

    </div>

    <div class="d-flex justify-content-end gap-3 mt-4">

      <a [routerLink]="getBackRoute()" class="btn btn-outline-secondary px-4">

        Cancel

      </a>

      <button type="submit" [disabled]="form.invalid" class="btn btn-primary px-4">

        Save

      </button>

    </div>

  </form>

</div>
