<div class="rounded-4 border p-4 shadow-sm bg-white">

    <div class="mb-4">

        <h2 class="h4 fw-semibold">
            Update User
        </h2>

    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

        <!-- First Name -->

        <div class="mb-3">

            <label class="form-label">
                First Name
            </label>

            <input type="text" formControlName="firstName" class="form-control">

        </div>

        <!-- Last Name -->

        <div class="mb-3">

            <label class="form-label">
                Last Name
            </label>

            <input type="text" formControlName="lastName" class="form-control">

        </div>

        <!-- Email -->

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email" formControlName="email" class="form-control">

        </div>

        <!-- Role -->

        <div class="mb-3">

            <label class="form-label">
                Role
            </label>

            <select formControlName="role" class="form-select">

                <option value="employee">
                    Employee
                </option>

                <option value="company">
                    Company
                </option>

                <option value="admin">
                    Admin
                </option>

            </select>

        </div>

        <!-- Status -->

        <div class="mb-3">

            <label class="form-label">
                Status
            </label>

            <select formControlName="isActive" class="form-select">

                <option [ngValue]="true">
                    Active
                </option>

                <option [ngValue]="false">
                    Inactive
                </option>

            </select>

        </div>

        <div class="d-flex justify-content-end gap-3 mt-4">

            <a routerLink="/admin/users" class="btn btn-outline-secondary px-4">

                Cancel

            </a>

            <button type="submit" class="btn btn-primary px-4">

                Update

            </button>

        </div>

    </form>

</div>
