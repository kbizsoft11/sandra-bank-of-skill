<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">

    <div class="mb-8">

        <h2 class="text-2xl font-semibold">
            Update User
        </h2>

    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

        <!-- First Name -->

        <div>

            <label class="mb-2 block">
                First Name
            </label>

            <input type="text" formControlName="firstName" class="w-full rounded-lg border p-3">

        </div>

        <!-- Last Name -->

        <div>

            <label class="mb-2 block">
                Last Name
            </label>

            <input type="text" formControlName="lastName" class="w-full rounded-lg border p-3">

        </div>

        <!-- Email -->

        <div>

            <label class="mb-2 block">
                Email
            </label>

            <input type="email" formControlName="email" class="w-full rounded-lg border p-3">

        </div>

        <!-- Role -->

        <div>

            <label class="mb-2 block">
                Role
            </label>

            <select formControlName="role" class="w-full rounded-lg border p-3">

                <option value="employee">
                    Employee
                </option>

                <option value="company">
                    Company
                </option>

                <option value="admin">
                    Admin
                </option>

            </select>

        </div>

        <!-- Status -->

        <div>

            <label class="mb-2 block">
                Status
            </label>

            <select formControlName="isActive" class="w-full rounded-lg border p-3">

                <option [ngValue]="true">
                    Active
                </option>

                <option [ngValue]="false">
                    Inactive
                </option>

            </select>

        </div>

        <div class="flex justify-end gap-3">

            <a routerLink="/admin/users" class="rounded-lg border px-5 py-2">

                Cancel

            </a>

            <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-white">

                Update

            </button>

        </div>

    </form>

</div>
