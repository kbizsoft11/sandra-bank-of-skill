<div class="rounded-4 border bg-white shadow-sm overflow-hidden">

  <div class="d-flex align-items-center justify-content-between border-bottom px-4 py-3">

    <div>
      <h2 class="h5 fw-semibold mb-0 text-dark">
        Users
      </h2>

      <p class="mt-1 mb-0 small text-secondary">
        Manage all users from one place
      </p>
    </div>

    <a routerLink="/admin/users/create" class="btn btn-primary btn-sm px-3">
      Add User
    </a>

  </div>

  <div class="table-responsive">

    <table class="table align-middle mb-0">

      <thead>
        <tr class="table-light">

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Name
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Email
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Role
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Actions
          </th>

        </tr>
      </thead>

      <tbody>

        @for (user of users(); track user._id) {

        <tr>

          <td class="px-4 py-3">

            <div class="d-flex align-items-center gap-3">

              <div class="d-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary fw-semibold" style="width: 40px; height: 40px;">
                {{ user.fullName?.charAt(0) }}
              </div>

              <div>
                <p class="fw-medium mb-0 text-dark">
                  {{ user.fullName }}
                </p>
              </div>

            </div>

          </td>

          <td class="px-4 py-3 text-secondary">
            {{ user.email }}
          </td>

          <td class="px-4 py-3">

            <span class="badge rounded-pill bg-success-subtle text-success-emphasis px-3 py-2 fw-medium">
              {{ user.role }}
            </span>

          </td>

          <td class="px-4 py-3">
            <app-table-actions [actions]="['edit','delete']" (edit)="editUser(user)"
              (delete)="deleteUser(user)">
            </app-table-actions>
          </td>

        </tr>

        }

      </tbody>

    </table>

  </div>

</div>
