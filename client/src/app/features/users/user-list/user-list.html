<div
  class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">

  <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 dark:border-slate-800">

    <div>
      <h2 class="text-xl font-semibold text-slate-900 dark:text-white">
        Users
      </h2>

      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Manage all users from one place
      </p>
    </div>

    <a routerLink="/admin/users/create"
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700">
      Add User
    </a>

  </div>

  <div class="overflow-x-auto">

    <table class="min-w-full">

      <thead>
        <tr class="border-b border-slate-200 bg-slate-50 dark:border-slate-800 dark:bg-slate-800/50">

          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">
            Name
          </th>

          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">
            Email
          </th>

          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">
            Role
          </th>

          <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">
            Actions
          </th>

        </tr>
      </thead>

      <tbody>

        @for (user of users(); track user._id) {

        <tr
          class="border-b border-slate-100 transition hover:bg-slate-50 dark:border-slate-800 dark:hover:bg-slate-800/30">

          <td class="px-6 py-4">

            <div class="flex items-center gap-3">

              <div
                class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 font-semibold text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">
                {{ user.firstName?.charAt(0) }}
              </div>

              <div>
                <p class="font-medium text-slate-900 dark:text-white">
                  {{ user.firstName }} {{ user.lastName }}
                </p>
              </div>

            </div>

          </td>

          <td class="px-6 py-4 text-slate-600 dark:text-slate-300">
            {{ user.email }}
          </td>

          <td class="px-6 py-4">

            <span
              class="rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700 dark:bg-green-500/10 dark:text-green-400">
              {{ user.role }}
            </span>

          </td>

          <td class="px-6 py-4">
            <app-table-actions [actions]="['view','edit','delete']" (view)="viewUser(user)" (edit)="editUser(user)"
              (delete)="deleteUser(user)">
            </app-table-actions>
          </td>

        </tr>

        }

      </tbody>

    </table>

  </div>

</div>
