<div class="rounded-4 border bg-white shadow-sm overflow-hidden">

  <div class="d-flex align-items-center justify-content-between border-bottom px-4 py-3">

    <div>
      <h2 class="h5 fw-semibold mb-0 text-dark">
        Skill Categories
      </h2>

      <p class="mt-1 mb-0 small text-secondary">
        Manage all skill categories
      </p>

    </div>

    <a routerLink="/admin/skill-categories/create" class="btn btn-primary btn-sm px-3">

      Add Category

    </a>

  </div>

  <div class="table-responsive">

    <table class="table align-middle mb-0">

      <thead>

        <tr class="table-light">

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Name
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Description
          </th>

          <th class="px-4 py-3 text-uppercase small fw-semibold text-secondary">
            Actions
          </th>

        </tr>

      </thead>

      <tbody>

        @for(category of categories(); track category._id){

        <tr>

          <td class="px-4 py-3">

            {{category.cat_name}}

          </td>

          <td class="px-4 py-3 text-secondary">

            {{category.cat_desc}}

          </td>

          <td class="px-4 py-3">

            <app-table-actions
              [actions]="['edit','delete']"
              (edit)="editCategory(category)"
              (delete)="deleteCategory(category)">
            </app-table-actions>

          </td>

        </tr>

        }

      </tbody>

    </table>

  </div>

</div>
