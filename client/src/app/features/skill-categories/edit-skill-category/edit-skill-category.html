<div class="rounded-4 border p-4 shadow-sm bg-white">

    <div class="mb-4">

        <h2 class="h4 fw-semibold text-dark">

            Edit Skill Category

        </h2>

        <p class="mt-1 small text-secondary">

            Update skill category details.

        </p>

    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="mb-3">

            <label class="form-label small fw-medium">

                Category Name

            </label>

            <input type="text" formControlName="name" class="form-control">

            @if(form.controls.name.invalid &&
            form.controls.name.touched){

            <p class="mt-2 small text-danger">

                Category name is required.

            </p>

            }

        </div>

        <div class="mb-3">

            <label class="form-label small fw-medium">

                Description

            </label>

            <textarea rows="5" formControlName="description" class="form-control">
      </textarea>

        </div>

        <!-- Status Toggle Switch -->
        <div class="mb-4">
            <label class="form-label small fw-medium">Status</label>
            <div class="d-flex align-items-center gap-3">
                <div class="form-check form-switch">
                    <input 
                        class="form-check-input" 
                        type="checkbox" 
                        id="statusSwitch"
                        formControlName="status"
                        style="width: 3rem; height: 1.5rem; cursor: pointer;">
                    <label class="form-check-label" for="statusSwitch">
                        @if(form.get('status')?.value === 'active') {
                            <span class="badge bg-success-subtle text-success-emphasis">Active</span>
                        } @else {
                            <span class="badge bg-danger-subtle text-danger-emphasis">Inactive</span>
                        }
                    </label>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mt-4">

            <button type="button" (click)="cancel()" class="btn btn-outline-secondary px-4">

                Cancel

            </button>

            <button type="submit" [disabled]="loading()" class="btn btn-primary px-4">
                @if(loading()) {
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                    Updating...
                } @else {
                    Update
                }
            </button>

        </div>

    </form>

</div>
