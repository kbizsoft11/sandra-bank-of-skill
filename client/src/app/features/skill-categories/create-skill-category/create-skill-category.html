<div class="rounded-4 border p-4 shadow-sm bg-white">

    <div class="mb-4">

        <h2 class="h4 fw-semibold text-dark">

            Create Skill Category

        </h2>

        <p class="mt-1 small text-secondary">

            Add a new skill category.

        </p>

    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="mb-3">

            <label class="form-label small fw-medium">

                Category Name

            </label>

            <input type="text" formControlName="cat_name" class="form-control">

            @if(form.controls.cat_name.invalid &&
            form.controls.cat_name.touched){

            <p class="mt-2 small text-danger">

                Category name is required.

            </p>

            }

        </div>

        <div class="mb-3">

            <label class="form-label small fw-medium">

                Description

            </label>

            <textarea rows="5" formControlName="cat_desc" class="form-control">
      </textarea>

        </div>

        <div class="d-flex justify-content-end gap-3 mt-4">

            <button type="button" routerLink="/admin/skill-categories" class="btn btn-outline-secondary px-4">

                Cancel

            </button>

            <button type="submit" class="btn btn-primary px-4">

                Save

            </button>

        </div>

    </form>

</div>
