<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">

    <div class="mb-8">

        <h2 class="text-2xl font-semibold text-slate-900 dark:text-white">

            Create Skill Category

        </h2>

        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">

            Add a new skill category.

        </p>

    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

        <div>

            <label class="mb-2 block text-sm font-medium">

                Category Name

            </label>

            <input type="text" formControlName="cat_name"
                class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500">

            @if(form.controls.cat_name.invalid &&
            form.controls.cat_name.touched){

            <p class="mt-2 text-sm text-red-500">

                Category name is required.

            </p>

            }

        </div>

        <div>

            <label class="mb-2 block text-sm font-medium">

                Description

            </label>

            <textarea rows="5" formControlName="cat_desc"
                class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500">
      </textarea>

        </div>

        <div class="flex justify-end gap-3">

            <button type="button" routerLink="/admin/skill-categories" class="rounded-lg border px-5 py-2">

                Cancel

            </button>

            <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 font-medium text-white hover:bg-blue-700">

                Save

            </button>

        </div>

    </form>

</div>
