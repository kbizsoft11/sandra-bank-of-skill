<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <div class="org-details-card">
        <div class="text-center mb-4">
          <span class="org-details-step">Company Profile</span>
          <h2 class="org-details-title">Organisation Details</h2>
          <p class="org-details-subtitle">Keep your organisation profile polished and up to date for your team and candidates.</p>
        </div>

        @if (isLoading()) {
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 mb-0 text-secondary">Loading organisation details...</p>
          </div>
        } @else {
          <form [formGroup]="organisationForm" (ngSubmit)="onSubmit()">
            <div class="row g-4">
              <div class="col-12 col-lg-6">
                <label class="form-label org-details-label">Organisation Name</label>
                <div class="org-details-input-group">
                  <span><i class="bi bi-buildings"></i></span>
                  <input type="text" class="form-control org-details-input" formControlName="organisationName" placeholder="Enter your organisation name">
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <label class="form-label org-details-label">Industry</label>
                <div class="org-details-input-group">
                  <span><i class="bi bi-briefcase"></i></span>
                  <select class="form-select org-details-select" formControlName="industry">
                    <option value="" disabled>Select your industry</option>
                    <option>Information Technology</option>
                    <option>Healthcare & Medical</option>
                    <option>Banking & Finance</option>
                    <option>Education</option>
                    <option>Retail & E-Commerce</option>
                    <option>Manufacturing</option>
                    <option>Construction</option>
                    <option>Hospitality</option>
                    <option>Real Estate</option>
                    <option>Marketing & Advertising</option>
                    <option>Government</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <label class="form-label org-details-label">Team Size</label>
                <div class="org-details-input-group">
                  <span><i class="bi bi-people"></i></span>
                  <select class="form-select org-details-select" formControlName="companySize">
                    <option value="" disabled>Select team size</option>
                    <option value="1-10">1 - 10 Employees</option>
                    <option value="11-50">11 - 50 Employees</option>
                    <option value="51-200">51 - 200 Employees</option>
                    <option value="201-500">201 - 500 Employees</option>
                    <option value="500+">500+ Employees</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <label class="form-label org-details-label">Country</label>
                <div class="org-details-input-group">
                  <span><i class="bi bi-globe"></i></span>
                  <select class="form-select org-details-select" formControlName="country">
                    <option value="" disabled>Select your country</option>
                    <option>India 🇮🇳</option>
                    <option>United States 🇺🇸</option>
                    <option>United Kingdom 🇬🇧</option>
                    <option>Canada 🇨🇦</option>
                    <option>Australia 🇦🇺</option>
                    <option>Germany 🇩🇪</option>
                    <option>Singapore 🇸🇬</option>
                    <option>United Arab Emirates 🇦🇪</option>
                    <option>Japan 🇯🇵</option>
                    <option>France 🇫🇷</option>
                  </select>
                </div>
              </div>

              <div class="col-12">
                <label class="form-label org-details-label">Website</label>
                <div class="org-details-input-group">
                  <span><i class="bi bi-link-45deg"></i></span>
                  <input type="text" class="form-control org-details-input" formControlName="website" placeholder="https://yourcompany.com">
                </div>
              </div>

              <div class="col-12">
                <label class="form-label org-details-label">Description</label>
                <textarea class="form-control org-details-input" rows="4" formControlName="description" placeholder="Tell your team and candidates about your organisation"></textarea>
              </div>
            </div>

            @if (errorMessage()) {
              <div class="alert alert-danger mt-4" role="alert">{{ errorMessage() }}</div>
            }

            @if (successMessage()) {
              <div class="alert alert-success mt-4" role="alert">{{ successMessage() }}</div>
            }

            <div class="d-flex flex-wrap gap-2 mt-4">
              <button type="submit" class="btn org-details-continue-btn" [disabled]="isSaving() || organisationForm.invalid">
                @if (isSaving()) {
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Saving...
                } @else {
                  Save Changes
                }
              </button>
              <button type="button" class="btn btn-outline-secondary" (click)="loadOrganisation()">
                <i class="bi bi-arrow-clockwise me-2"></i>Reset
              </button>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</div>
