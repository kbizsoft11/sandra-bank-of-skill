<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank of Skill — Coming Soon</title>
<style>
  :root{
    --bg-top:#eef6ff;
    --bg-bottom:#dcebff;
    --badge-bg:#d7ebff;
    --badge-text:#2f6fb0;
    --ink:#0f1720;
    --muted:#5b6472;
    --green:#1c9a56;
    --orange:#d99a2b;
    --orange-dark:#bd8a25;
    --card:#ffffff;
    --border:#e6edf5;
    --success-bg:#eafaf1;
    --success-border:#bfe8cf;
    --success-text:#1c6b41;
    --error-bg:#fdecec;
    --error-border:#f3c2c2;
    --error-text:#a3312e;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Mobile-first base layout ---------- */
  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 16px 32px;
  }

  .stage{
    width:100%;
    max-width:440px;
    text-align:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--badge-bg);
    color:var(--badge-text);
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
  }
  .badge::before{
    content:'';
    width:6px;height:6px;border-radius:50%;
    background:var(--badge-text);
  }

  h1{
    font-weight:800;
    font-size:30px;
    line-height:1.18;
    letter-spacing:-0.02em;
    margin:18px 0 0;
  }
  h1 .accent{color:var(--green)}

  p.lead{
    margin:14px auto 0;
    color:var(--muted);
    font-size:15.5px;
    line-height:1.55;
    max-width:34ch;
  }

  /* Newsletter-style single field + button */
  .signup{
    margin-top:26px;
    text-align:left;
  }

  .field{
    display:flex;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:999px;
    box-shadow:0 8px 20px rgba(20,40,80,0.07);
    padding:5px;
    gap:6px;
  }

  input[type="email"]{
    flex:1;
    min-width:0;
    border:0;
    background:transparent;
    padding:11px 14px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
  }
  input[type="email"]::placeholder{color:#9aa4b2}

  button{
    flex-shrink:0;
    background:var(--orange);
    color:#fff;
    border:0;
    border-radius:999px;
    padding:0 20px;
    font-size:14.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease;
  }
  button:hover{background:var(--orange-dark)}
  button:active{transform:translateY(1px)}

  .field:focus-within{
    border-color:var(--badge-text);
    box-shadow:0 0 0 3px rgba(47,111,176,0.15);
  }

  #feedback{margin-top:10px}
  .success,.error{
    font-size:13px;
    padding:10px 12px;
    border-radius:10px;
    text-align:left;
  }
  .success{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success-text)}
  .error{background:var(--error-bg);border:1px solid var(--error-border);color:var(--error-text)}

  .muted{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:16px;
  }

  /* ---------- Larger screens ---------- */
  @media (min-width:640px){
    .stage{max-width:560px}
    h1{font-size:40px}
    p.lead{font-size:16.5px;max-width:38ch}
    .field{padding:6px}
    input[type="email"]{padding:13px 18px;font-size:16px}
    button{padding:0 26px;font-size:15px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <span class="badge">AI-Powered Talent Discovery Platform</span>

      <h1>Bank of Skill is<br>launching <span class="accent">soon</span></h1>
      <p class="lead">Discover the skills, languages, and expertise already hidden inside your workforce. Be first to know when we go live.</p>

      <div class="signup">
        <form id="waitlist-form" autocomplete="off">
          <div class="field">
            <input id="email" type="email" placeholder="Enter your email" required />
            <button type="submit">Notify me</button>
          </div>
          <div id="feedback" aria-live="polite"></div>
        </form>
        <div class="muted">We respect your privacy. No spam — unsubscribe anytime.</div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('waitlist-form');
    const feedback = document.getElementById('feedback');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      feedback.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      if (!email) { feedback.innerHTML = '<div class="error">Please enter your email.</div>'; return; }

      try {
        const res = await fetch('https://bankofskill.com/api/waitlist', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        feedback.innerHTML = '<div class="success">Thanks — we\'ll email you when we launch.</div>';
        form.reset();
      } catch (err) {
        feedback.innerHTML = `<div class="error">${err.message || 'Something went wrong'}</div>`;
      }
    });
  </script>
</body>
</html>
